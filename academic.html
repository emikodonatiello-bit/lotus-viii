<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <title>Academic Lotus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Genos:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      color: #f0f0e2;
      font-family: "Science Gothic", sans-serif;
      font-optical-sizing: auto;
      font-weight: 350;
      font-style: normal;
      font-variation-settings: "slnt" 0, "width" 140, "CTRS" 12;
      background-image: url(https://gifcity.carrd.co/assets/images/gallery67/75e6f98d.jpg?v=3fc8f5cd);
      background-size: 15%;
    }
    #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif");
            opacity: 0.25;
            pointer-events: none;
            z-index: 100 ;
        }
    svg {
      width:80%;
      rotate: 180deg;
      position: relative;
      z-index: 99;
      top:-300px;
      left:500px;
      fill: black;
      stroke: rgb(64, 117, 152);
    }
    #floating {
    animation-name: floating;
    animation-duration: 3s;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
    color:black;
    margin:20px;
    }
 
      @keyframes floating {
    0% { transform: translate(0, 0px); }
    50% { transform: translate(0, 15px); }
    100% { transform: translate(0, -0px); }
    }
  </style>
</head>
<body>

    <div id="bg-image"></div>
    <div id="overlay"></div>
    <div id="floating">vgknwlESrdlktjgmrole'matolgrpe'majotgl;remkabtlgmerk</div>
    
    <svg viewbox="0 0 500 200" class="svg-1">

    <path id="curve" d="M50,150 Q250,-50 450,150" fill="tranparent"/>
    
    <text>
      <TextPath href="#curve" startOffset="10%">Academic Lotus</TextPath>
    </text>
    <script src="script.js">
      const textPath = document.querySelector('textPath');

      let offset = 0;

      function animateText() {
        offset += 0.25;

        if (offset > 100) {
          offset = 0;
        }

        textPath.setAttribute('startOffset', offset + '%');
        
        requestAnimationFrame(animateText);
      }

      animateText();
    </script>
