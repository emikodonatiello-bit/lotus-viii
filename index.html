<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Lotus VIII</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js"></script>
    </head>
    <body>
        <section class="flowerToggle">
            <!-- 1. The default src is now your frozen static placeholder image file -->
            <a><img id="flowerImg" src="images/axs5gn-static.png" style="height:auto" alt="Flower"/></a>
        </section>
        <section id="overlay">
            <img src="https://neocities.org" /><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
            <img src="https://neocities.org" />
        </section>
    </body>
</html>
    <style>
        .flowerToggle {
            display: flex;
            justify-content: center;
            align-items:center;
            width:100%;
            margin:auto;
            position:relative;
            top:350px;
        }
        #overlay {
      position:fixed;
      background-image: url("https://neocities.org");
      width:10000px;
      height:10000px;
      top:0px;
      right:0px;
      filter:opacity(50%);
      pointer-events: none;
      background-color: rgba(0, 0, 0, 0.5)
    }
    </style>
<script>
    const flowerImg = document.getElementById('flowerImg');
    
    // 2. Define your static "frozen" image path and your animated image path
    const staticImg = 'images/axs5gn-static.png'; 
    const animatedGif = 'images/axs5gn.gif';

    flowerImg.addEventListener('mouseenter', () => {
      // 3. Swap to the animation file and force it to play from frame one
      flowerImg.src = `${animatedGif}?t=${Date.now()}`;
    });

    flowerImg.addEventListener('mouseleave', () => {
      // 4. Revert instantly back to the frozen static image path when the mouse leaves
      flowerImg.src = staticImg;
    });
</script>
