<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Lotus VIII</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js"></script>
    </head>
    <body>
        <section class="flowerToggle">
            <!-- Added the ID "flowerImg" to target it with JavaScript -->
            <a><img id="flowerImg" src="images/axs5gn.gif" style="height:auto"/></a>
        </section>
        <section id="overlay">
            <img src="https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif" /><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
            <img src="https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif" />
        </section>
    </body>
</html>
    <style>
        .flowerToggle {
            display: flex;
            justify-content: center;
            align-items:center;
            width:100%;
            margin:auto;
            position:relative;
            top:350px;
        }
        #overlay {
      position:fixed;
      background-image: url("https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif");
      width:10000px;
      height:10000px;
      top:0px;
      right:0px;
      filter:opacity(50%);
      pointer-events: none;
      background-color: rgba(0, 0, 0, 0.5)
    }
    </style>
<script>
    const flowerImg = document.getElementById('flowerImg');

    const localHoverGif = 'images/axs5gn.gif';

    flowerImg.addEventListener('mouseenter', () => {
      flowerImg.src = `${localHoverGif}?t=${Date.now()}`;
    });

    flowerImg.addEventListener('mouseleave', () => {
      flowerImg.src = `${localHoverGif}?t=${Date.now()}`;
    });
</script>
