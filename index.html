<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Lotus VIII</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .flowerToggle {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 1;
        }

        #flowerImg {
            max-width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif");
            opacity: 0.5;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <section class="flowerToggle">
        <a href="https://emikodonatiello-bit.github.io/lotus-viii/home">
            <img id="flowerImg" src="images/start.gif" alt="Flower"/>
        </a>
    </section>
    <div id="overlay"></div>

    <script>
        // 1. Target the HTML image container
        const flowerImg = document.getElementById('flowerImg');
        
        // 2. Map out your explicit asset states
        const staticStartImg = 'images/start.gif'; // First frame placeholder
        const animatedGif = 'images/enter.gif';    // Your 1-loop animation asset
        const finalEndImg = 'images/end.gif';      // The final resting frame asset

        // 3. Set your animation timing configuration
        // CHANGE THIS NUMBER to match the exact duration of your enter.gif file in milliseconds!
        const animationDuration = 2000; 
        
        let animationTimer = null;

        // 4. Hover Event Action Logic
        flowerImg.addEventListener('mouseenter', () => {
            // Stop active timers if the user quickly hovers in and out to prevent glitchy image swapping
            clearTimeout(animationTimer);
            
            // Force the animation file to load and play cleanly from frame one using a unique timestamp
            flowerImg.src = `${animatedGif}?t=${Date.now()}`;
            
            // Cleanly transition to the solid permanent end frame asset right as the animation finishes its loop
            animationTimer = setTimeout(() => {
                flowerImg.src = finalEndImg;
            }, animationDuration);
        });

        /* 
           Note: The 'mouseleave' listener remains excluded so that the graphic stays 
           permanently frozen on the finalEndImg asset even if the user moves their mouse away.
        */
    </script>
</body>
</html>
