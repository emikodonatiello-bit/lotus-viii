<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Lotus Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('backgrounds/lotushome.png');
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0.5;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
</body>
</html>
