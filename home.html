<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Lotus Home</title>
    // title font
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
    // body font
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Genos:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            font-family: "Science Gothic", sans-serif;
            font-optical-sizing: auto;
            font-weight: 350;
            font-style: normal;
            font-variation-settings:
            "slnt" 0,
            "wdth" 140,
            "CTRS" 12;
        }
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("backgrounds/lotus-home.png");
            background-position: center;
            background-size: cover;
            z-index: 1;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("https://neocities.org");
            opacity: 0.3;
            pointer-events: none;
            z-index: 2;
        }
        #main-flex {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 1000px;
            padding: 20px;
        }
        #heading {
            margin-bottom: 20px;
            max-width: 100%;
            height: auto;
            background-color: grey;
            opacity: 0.5;
            border: 5px solid #ffffff;
        }
        #sub-main-flex {
            display: flex;
            flex-direction: row;
            align-items: ;
            justify-content: ;
            text-align: left;
            max-width: 650px;
            padding: 20px;
        }
        #navigation {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            text-align: left;
            max-width: 200px;
            max-height: max-content;
            padding: 20px;
            background-color: grey;
            opacity: 0.5;
            border: 5px solid #ffffff;
        }
        .science-gothic-wide {
            font-family: "Science Gothic", sans-serif;
            font-optical-sizing: auto;
            font-weight: 750;
            font-style: normal;
            font-variation-settings:
            "slnt" 0,
            "wdth" 140,
            "CTRS" 0;
            margin-bottom: 15px;
        }
        button  {
            padding: 5px;
            border: 5px solid #ffffff;
        }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div id="overlay"></div>

    <main id="main-flex">
        <h1 class="science-gothic-wide" id="heading">
            <img src=""/>LOTUS VIII
        </h1>
        <div id="sub-main-flex">
            <aside id="navigation">
                <a href="" alt="button">Hobbies</a>
            </aside>
            <p>Intro text</p>
        </div>
    </main>
</body>
</html>
