<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Lotus Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("backgrounds/lotus-home.png");
            background-position: center;
            background-size: cover;
            z-index: 1;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif");
            opacity: 0.3;
            pointer-events: none;
            z-index: 2;
        }
        #main-flex {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            text-align: left;
        }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div id="overlay"></div>

    <main id="main-flex">
        <h1><img src=""/>Lotus VIII</h1>
    </main>
</body>
</html>
