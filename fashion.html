<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fashion VIII</title>
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Genos:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      color: #f0f0e2;
      font-family: 'Barriecito', system-ui, sans-serif;
      background-image: url(backgrounds/fashiones.jpg);
      background-size: 10%;
    }
    #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif");
            opacity: 0.25;
            pointer-events: none;
            z-index: 100 ;
        }
    #actual-main-flex {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      padding: 20px;
      width: 100%;
      min-width: 500px;
    }
    #main-flex {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 960px;
      padding: 10px;
      width: 80%;
      min-width: 500px;
      border-radius:5%;
      background-image: url("backgrounds/brown lace.png");
      background-size: 100%;

    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background-color: rgba(226, 60, 198, 0.901);
      border:white dashed 3px;
      padding:10px;
      width:75%;
      border-radius: 20px;
    }
    
    #sub-main-flex {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      text-align: left;
      width: 100%; /* Fixed: Gives flexbox width to spread elements apart */
      max-width: 1000px;
      height: fit-content;
    }
    #blinkies {
      display: inline-block;
      height: 20px;
      background-color: #f0f0e2;
    }
    marquee {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      scroll-direction: left;
      background-color: black;
      width:105%;
    }
  </style>
</head>
<body>

  <div id="bg-image"></div>
  <div id="overlay"></div>
        <div id="main-flex">
            <h1><img src="images/fashionviii-header.png" style="width: 75%; height: auto;"></h1>
            <iframe src="https://lotus-viii.github.io/lotus-viii/digital-dollmaker/dollmaker" style="width: 100%; height: 100vh; border: none; margin-top: 20px; margin-bottom: 20px; display: block;"></iframe>
        </div>
  
</body>
