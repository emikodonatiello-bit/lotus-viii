<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VIIIFashion</title>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      color: #f0f0e2;
      font-family: Arial, sans-serif;
      font-weight: 250;
      font-style: normal;
      font-variation-settings: "slnt" 0, "width" 140, "CTRS" 12;
      background-image: url(backgrounds/hobbiez.jpg);
      background-size: 50%;
    }
    #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif");
            opacity: 0.25;
            pointer-events: none;
            z-index: 100 ;
        }
    
    #main-flex {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 1500px;
      padding: 20px;
      width: 800px;
      min-width: 500px;
      background-image: url("backgrounds/studs.png");
      background-size: 10%;
    }
    
    #heading {
      margin: 20px;
      width: 100%;
      max-width: 1000px;
      height: auto;
      border: 1px solid #f0f0e2;
      padding: 15px;
      box-sizing: border-box;
      text-align: left;
      font-weight:lighter;
      color: white;
      background-color: black;
    }
    
    #sub-main-flex {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      text-align: left;
      width: 100%; /* Fixed: Gives flexbox width to spread elements apart */
      max-width: 1000px;
      gap: 20px; /* Adds consistent spacing between sidebar and text */
    }
    #blinkies {
      display: inline-block;
      height: 20px;
      background-color: #f0f0e2;
    }
    marquee {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      scroll-direction: left;
      background-color: black;
      width:105%;
    }
    section {
      flex: 1;
      padding: 10px;
      box-sizing: border-box;
    }
    box {
      display: block;
      width: 100%;
      height: fit-content;
      background-color: black;
      border: 1px solid white;
    }
    #left-column {
      max-width: 300px;
    }
  </style>
</head>
<body>

  <div id="bg-image"></div>
  <div id="overlay"></div>
  
  <main id="main-flex">
    <h1 id="heading">Fashion</h1>
    
    <div id="sub-main-flex">
      
    </div>
  </main>

</body>
</html>

      </section>
    </div>
  </main>

</body>
</html>
