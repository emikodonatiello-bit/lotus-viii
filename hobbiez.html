<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hobbiez</title>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      color: #f0f0e2;
      font-family: Arial, sans-serif;
      font-weight: 250;
      font-style: normal;
      font-variation-settings: "slnt" 0, "width" 140, "CTRS" 12;
      background-image: url(backgrounds/hobbiez.jpg);
      background-size: 25%;
    }
    #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("https://bettysgraphics.neocities.org/images/backgrounds/pattern%20467.gif");
            opacity: 0.25;
            pointer-events: none;
            z-index: 100 ;
        }
    
    #main-flex {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 2000px;
      padding: 20px;
      width: 1000px;
      min-width: 500px;
      background-color: #000;
    }
    
    #heading {
      margin: 20px;
      width: 100%;
      max-width: 1000px;
      height: auto;
      background-color:#7d7d7d91; 
      border: 1px solid #f0f0e2;
      padding: 15px;
      box-sizing: border-box;
      text-align: left;
    }
    
    #sub-main-flex {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      text-align: left;
      width: 100%; /* Fixed: Gives flexbox width to spread elements apart */
      max-width: 1000px;
      gap: 20px; /* Adds consistent spacing between sidebar and text */
    }
  </style>
</head>
<body>

  <div id="bg-image"></div>
  <div id="overlay"></div>
  
  <main id="main-flex">
    <h1 id="heading">hobbiez</h1>
    
    <div id="sub-main-flex">
    </div>
  </main>

</body>
</html>
